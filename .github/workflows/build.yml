name: Build MovieBox TV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q payload.zip -d work

      - name: Install Rust for Android
        run: |
          rustup toolchain install stable --profile minimal -t armv7-linux-androideabi -t aarch64-linux-android
          rustup default stable
          rustc --version

      - name: Build the Rust app
        run: bash work/build-rust.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build the APK
        run: bash work/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MovieBox-APK
          path: work/android-tv/app/build/outputs/apk/debug/app-debug.apk
          
