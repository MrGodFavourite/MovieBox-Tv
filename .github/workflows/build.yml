name: Build MovieBox TV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q payload.zip -d work

      - name: Install Rust for 32-bit Android TV
        run: |
          rustup toolchain install stable --profile minimal -t armv7-linux-androideabi
          rustup default stable
          rustc --version

      - name: Build the Rust app
        working-directory: work/moviebox
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          T="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$T:$PATH"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$T/armv7a-linux-androideabi24-clang"
          export CC_armv7_linux_androideabi="$T/armv7a-linux-androideabi24-clang"
          export AR_armv7_linux_androideabi="$T/llvm-ar"
          cargo build --release --target armv7-linux-androideabi
          file target/armv7-linux-androideabi/release/moviebox-tui
          mkdir -p ../android-tv/app/src/main/jniLibs/armeabi-v7a
          cp target/armv7-linux-androideabi/release/moviebox-tui ../android-tv/app/src/main/jniLibs/armeabi-v7a/libmoviebox.so

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build the APK
        working-directory: work/android-tv
        run: |
          ok=0
          for pass in 1 2; do
            for v in v0.118.0 0.118.0 v0.118.1 0.118.1; do
              echo "=== Trying terminal library $v ==="
              if gradle assembleDebug -PtermuxVer=$v --no-daemon; then ok=1; break 2; fi
            done
            sleep 90
          done
          test "$ok" = 1

      - uses: actions/upload-artifact@v4
        with:
          name: MovieBox-TV-APK
          path: work/android-tv/app/build/outputs/apk/debug/app-debug.apk
          
